
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book your appointment with SMARTMEDI doctors. Schedule consultations with experienced healthcare professionals.">
    <meta name="keywords" content="book appointment, doctor consultation, healthcare, online booking">
    <title>Book Appointment - SMARTMEDI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .appointment-page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            margin-top: 80px;
        }

        .appointment-page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .appointment-page-header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        /* Progress Indicator */
        .progress-indicator {
            background: white;
            padding: 30px 20px;
            margin-bottom: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .progress-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .progress-step {
            text-align: center;
            flex: 1;
            z-index: 2;
        }

        .progress-step-number {
            width: 40px;
            height: 40px;
            background: #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
            margin: 0 auto 8px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .progress-step.active .progress-step-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .progress-step.completed .progress-step-number {
            background: #28A745;
            color: white;
        }

        .progress-step-label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
            margin-top: 5px;
        }

        .progress-connector {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e0e0e0;
            z-index: 1;
            margin: 0 5%;
        }

        .appointment-container {
            padding: 40px 20px;
        }

        .appointment-main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .appointment-steps {
            background: #f8f9fa;
            padding: 40px;
            border-radius: 12px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .appointment-steps h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #333;
        }

        .step-item {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            align-items: flex-start;
        }

        .step-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .step-content h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #333;
        }

        .step-content p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .appointment-form-section {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .appointment-form-section h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #333;
        }

        .form-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-top: 30px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section-title:first-child {
            margin-top: 0;
        }

        .appointment-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }

        .required-indicator {
            color: #DC3545;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error,
        .form-group select.error,
        .form-group textarea.error {
            border-color: #DC3545;
            background-color: #fff5f5;
        }

        .error-message {
            color: #DC3545;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row-three {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .radio-group {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        .radio-label input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin: 0;
        }

        .doctor-selection-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .doctor-option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: white;
        }

        .doctor-option:hover {
            border-color: #667eea;
            background-color: #f0f4ff;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
        }

        .doctor-option input[type="radio"] {
            display: none;
        }

        .doctor-option input[type="radio"]:checked + .doctor-label {
            color: #667eea;
            font-weight: 700;
        }

        .doctor-option input[type="radio"]:checked ~ .doctor-detail {
            color: #667eea;
        }

        .doctor-option input[type="radio"]:checked ~ .doctor-option-border {
            border: 2px solid #667eea;
        }

        .doctor-label {
            font-weight: 500;
            color: #333;
        }

        .doctor-detail {
            font-size: 0.85rem;
            color: #666;
        }

        .time-slots-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .time-slot {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            background: white;
        }

        .time-slot:hover {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .time-slot input[type="radio"] {
            display: none;
        }

        .time-slot input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .form-note {
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
            line-height: 1.5;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .benefits-highlight {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .benefits-highlight ul {
            list-style: none;
            padding: 0;
        }

        .benefits-highlight li {
            padding: 8px 0;
            color: #333;
        }

        .benefits-highlight li:before {
            content: "✓";
            color: #667eea;
            font-weight: bold;
            margin-right: 10px;
        }

        .success-message {
            background: #d4edda;
            border: 2px solid #28A745;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.5s ease-out;
        }

        .success-message.show {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Doctor Search Dropdown */
        .doctor-search-wrapper {
            position: relative;
        }

        .doctor-search-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .doctor-search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .doctor-dropdown {
            width: 100%;
        }

        .selected-doctor-info {
            background: #e8f5e9;
            border-left: 4px solid #28A745;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.95rem;
            color: #155724;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .selected-doctor-info i {
            color: #28A745;
            font-size: 1.2rem;
        }

        /* File Upload Container */
        .form-helper-text {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .file-upload-container {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: #f8f9fa;
            transition: all 0.3s;
            cursor: pointer;
        }

        .file-upload-container:hover {
            border-color: #764ba2;
            background: #f0f4ff;
        }

        .file-upload-container.dragover {
            border-color: #764ba2;
            background: #ede7f6;
        }

        .file-input-hidden {
            display: none;
        }

        .file-upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            color: #667eea;
        }

        .file-upload-label i {
            font-size: 2rem;
            color: #667eea;
        }

        .file-upload-label span {
            display: block;
        }

        .file-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            background: white;
            border: 1px solid #ddd;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .file-item-name {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            color: #333;
        }

        .file-item-size {
            color: #666;
            font-size: 0.85rem;
        }

        .file-item-remove {
            background: #DC3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: background 0.3s;
        }

        .file-item-remove:hover {
            background: #c82333;
        }

        @media (max-width: 768px) {
            .appointment-page-header h1 {
                font-size: 1.8rem;
            }

            .appointment-main-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .form-row,
            .form-row-three {
                grid-template-columns: 1fr;
            }

            .appointment-form-section {
                padding: 25px;
            }

            .appointment-steps {
                padding: 25px;
                position: static;
            }

            .radio-group {
                flex-direction: column;
                gap: 15px;
            }

            .doctor-selection-container {
                grid-template-columns: 1fr;
            }

            .time-slots-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .progress-steps {
                flex-wrap: wrap;
            }

            .progress-connector {
                display: none;
            }

            .progress-step {
                width: 25%;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">
                    <i class="fas fa-heartbeat"></i>
                    <span class="brand-name">SMARTMEDI</span>
                </div>
                
                <button class="navbar-toggle" id="navToggle" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <ul class="navbar-menu" id="navMenu">
                    <li><a href="../index.html" class="nav-link">Home</a></li>
                    <li><a href="doctors.html" class="nav-link">Doctors</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>

               
            </div>
        </div>
    </nav>
<main>
    <!-- Page Header -->
    <section class="appointment-page-header">
        <div class="container">
            <h1>Book Your Appointment</h1>
            <p>Schedule a consultation with our experienced doctors in minutes</p>
        </div>
    </section>

    <!-- Main Content -->
    <section class="appointment-container">
        <div class="container">

            <div class="appointment-main-grid">

                <!-- Left Column -->
                <div class="appointment-steps">
                    <h2>How It Works</h2>
                    <!-- left side content unchanged -->
                </div>

                <!-- Right Column: FORM -->
                <div class="appointment-form-section">
                    <h2>Appointment Form</h2>

                    <form class="appointment-form"
                          id="appointmentForm"
                          onsubmit="handleAppointmentSubmit(event)">

                        <!-- Step 1 -->
                        <div class="form-section-title">
                            <i class="fas fa-stethoscope"></i> Step 1: Select Service
                        </div>

                        <div class="form-group">
                            <label>Medical Service *</label>
                            <select name="service" required>
                                <option value="">-- Choose a service --</option>
                                <option value="general">General Consultation</option>
                                <option value="cardiology">Cardiology</option>
                                <option value="neurology">Neurology</option>
                                <option value="orthopedic">Orthopedic</option>
                            </select>
                        </div>

                        <!-- Step 2 -->
                        <div class="form-section-title">
                            <i class="fas fa-user-md"></i> Step 2: Select Doctor
                        </div>

                        <div class="form-group">
                            <select name="doctor" required>
                                <option value="">-- Select Doctor --</option>
                                <option value="Touhid Ara Himu">Touhid Ara Himu</option>
                                <option value="Mahmudul Hasan">Mahmudul Hasan</option>
                                <option value="Tashnuva Islam Ayona">Tashnuva Islam Ayona</option>
                                <option value="Towsif Rashid">Towsif Rashid</option>
                            </select>
                        </div>

                        <!-- Step 3 -->
                        <div class="form-section-title">
                            <i class="fas fa-calendar-alt"></i> Step 3: Date & Time
                        </div>

                        <div class="form-group">
                            <input type="date" name="appointmentDate" required>
                        </div>

                        <div class="form-group">
                            <select name="timeSlot" required>
                                <option value="">-- Time Slot --</option>
                                <option value="09:00">09:00 AM</option>
                                <option value="09:30">09:30 AM</option>
                                <option value="10:00">10:00 AM</option>
                                <option value="10:30">10:30 AM</option>
                                <option value="11:00">11:00 AM</option>
                                <option value="11:30">11:30 AM</option>
                            </select>
                        </div>

                        <!-- Step 4 -->
                        <div class="form-section-title">
                            <i class="fas fa-user"></i> Step 4: Patient Info
                        </div>

                        <div class="form-group">
                            <input type="number" name="age" placeholder="Age" required>
                        </div>

                        <div class="form-group">
                            <select name="bloodType">
                                <option value="">Blood Type</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>

                        <!-- Step 5 -->
                        <div class="form-section-title">
                            <i class="fas fa-heart"></i> Step 5: Health Info
                        </div>

                        <div class="form-group">
                            <textarea name="symptoms" placeholder="Symptoms" required></textarea>
                        </div>

                        <div class="form-group">
                            <textarea name="medicalHistory" placeholder="Medical History"></textarea>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" name="agree" required>
                                I agree to terms
                            </label>
                        </div>

                        <button type="submit" class="btn-submit">
                            Book Appointment Now
                        </button>

                    </form>

                    <p class="form-note">
                        <i class="fas fa-lock"></i>
                        Your information is secure.
                    </p>

                </div>
            </div>
        </div>
    </section>
</main>
<script>
function handleAppointmentSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const data = new FormData(form);
    const doctor = data.get('doctor');
    const date = data.get('appointmentDate');
    const time = data.get('timeSlot');
    alert(`Appointment booked!\nDoctor: ${doctor}\nDate: ${date}\nTime: ${time}\n\n(Backend not connected yet — your booking has been recorded locally.)`);
    form.reset();
}
</script>
